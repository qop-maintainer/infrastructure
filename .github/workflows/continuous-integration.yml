name: Continuous Integration

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/continuous-integration.yml'
      - 'terraform/**'
      - 'mise.toml'

  push:
    branches:
      - main
    paths:
      - '.github/workflows/continuous-integration.yml'
      - 'terraform/**'
      - 'mise.toml'

permissions: {}

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          disable-sudo-and-containers: true
          egress-policy: audit
          allowed-endpoints: >
            github.com:443

      - name: Checkout Repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Perform Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  terraform:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      TF_IN_AUTOMATION: true
      WORKING_DIRECTORY: terraform

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          disable-sudo: true
          egress-policy: audit
          allowed-endpoints: >
            github.com:443
            registry.terraform.io:443

      - name: Checkout Repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          show-progress: false

      - name: Retrieve Terraform version from mise.toml
        id: terraform-version
        run: echo "version=$(yq .tools.terraform mise.toml)" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.terraform-version.outputs.version }}

      - name: Configure AWS credentials PR (read-only)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE_PLAN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Initialise
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: terraform init -input=false -no-color
        working-directory: ${{ env.WORKING_DIRECTORY }}

      - name: Prettify
        run: terraform fmt -check -no-color
        working-directory: ${{ env.WORKING_DIRECTORY }}

      - name: Validate
        run: terraform validate -no-color
        working-directory: ${{ env.WORKING_DIRECTORY }}

      - name: Plan
        run: terraform plan -input=false -no-color
        working-directory: ${{ env.WORKING_DIRECTORY }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
